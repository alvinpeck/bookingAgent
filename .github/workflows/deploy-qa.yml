name: Deploy — QA

on:
  push:
    branches: [main]

env:
  PNPM_VERSION: "9.15.0"

jobs:
  migrate:
    name: Migrate DB (QA)
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: $(pnpm store path)
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @booking-agent/db db:migrate
        env:
          DATABASE_URL_DIRECT: ${{ secrets.QA_DATABASE_URL_DIRECT }}

  deploy:
    name: Deploy to Vercel (QA)
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: ${{ secrets.QA_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--env AUTH_SECRET=${{ secrets.QA_AUTH_SECRET }}
            --env NEXTAUTH_URL=${{ secrets.QA_APP_URL }}
            --env NEXT_PUBLIC_APP_URL=${{ secrets.QA_APP_URL }}
            --env DATABASE_URL=${{ secrets.QA_DATABASE_URL }}
            --env REDIS_URL=${{ secrets.QA_REDIS_URL }}
            --env JWT_SECRET=${{ secrets.QA_JWT_SECRET }}
            --env ENCRYPTION_KEY=${{ secrets.QA_ENCRYPTION_KEY }}
            --env CRON_SECRET=${{ secrets.QA_CRON_SECRET }}
            --env RESEND_API_KEY=${{ secrets.QA_RESEND_API_KEY }}
            --env EMAIL_FROM=${{ secrets.QA_EMAIL_FROM }}
            --env STRIPE_SECRET_KEY=${{ secrets.QA_STRIPE_SECRET_KEY }}
            --env STRIPE_WEBHOOK_SECRET=${{ secrets.QA_STRIPE_WEBHOOK_SECRET }}
            --env NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.QA_STRIPE_PUBLISHABLE_KEY }}"
