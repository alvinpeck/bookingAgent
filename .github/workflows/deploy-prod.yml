name: Deploy - Production

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

env:
  PNPM_VERSION: "9.15.0"

jobs:
  migrate:
    name: Migrate DB (Prod)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @booking-agent/db db:migrate
        env:
          DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL_DIRECT }}

  deploy:
    name: Deploy to Vercel (Prod)
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --env AUTH_SECRET="${{ secrets.PROD_AUTH_SECRET }}" \
            --env NEXTAUTH_URL="${{ secrets.PROD_APP_URL }}" \
            --env NEXT_PUBLIC_APP_URL="${{ secrets.PROD_APP_URL }}" \
            --env DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
            --env REDIS_URL="${{ secrets.PROD_REDIS_URL }}" \
            --env JWT_SECRET="${{ secrets.PROD_JWT_SECRET }}" \
            --env ENCRYPTION_KEY="${{ secrets.PROD_ENCRYPTION_KEY }}" \
            --env CRON_SECRET="${{ secrets.PROD_CRON_SECRET }}" \
            --env RESEND_API_KEY="${{ secrets.PROD_RESEND_API_KEY }}" \
            --env EMAIL_FROM="${{ secrets.PROD_EMAIL_FROM }}" \
            --env STRIPE_SECRET_KEY="${{ secrets.PROD_STRIPE_SECRET_KEY }}" \
            --env STRIPE_WEBHOOK_SECRET="${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}" \
            --env NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
