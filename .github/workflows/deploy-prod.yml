name: Deploy — Production

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

env:
  PNPM_VERSION: "9.15.0"

jobs:
  migrate:
    name: Migrate DB (Prod)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: $(pnpm store path)
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @booking-agent/db db:migrate
        env:
          DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL_DIRECT }}

  deploy:
    name: Deploy to Vercel (Prod)
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.PROD_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod
            --env AUTH_SECRET=${{ secrets.PROD_AUTH_SECRET }}
            --env NEXTAUTH_URL=${{ secrets.PROD_APP_URL }}
            --env NEXT_PUBLIC_APP_URL=${{ secrets.PROD_APP_URL }}
            --env DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            --env REDIS_URL=${{ secrets.PROD_REDIS_URL }}
            --env JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            --env ENCRYPTION_KEY=${{ secrets.PROD_ENCRYPTION_KEY }}
            --env CRON_SECRET=${{ secrets.PROD_CRON_SECRET }}
            --env RESEND_API_KEY=${{ secrets.PROD_RESEND_API_KEY }}
            --env EMAIL_FROM=${{ secrets.PROD_EMAIL_FROM }}
            --env STRIPE_SECRET_KEY=${{ secrets.PROD_STRIPE_SECRET_KEY }}
            --env STRIPE_WEBHOOK_SECRET=${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
            --env NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}"
