stages:
  - install
  - validate
  - build
  - cron

variables:
  PNPM_VERSION: "9"
  NODE_VERSION: "20"
  PNPM_HOME: "${CI_PROJECT_DIR}/.pnpm-home"

default:
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir "${CI_PROJECT_DIR}/.pnpm-store"

install:
  stage: install
  script:
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  artifacts:
    paths:
      - node_modules/
      - apps/web/node_modules/
      - packages/*/node_modules/
    expire_in: 1 hour

lint:
  stage: validate
  needs: [install]
  script:
    - pnpm lint
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull

typecheck:
  stage: validate
  needs: [install]
  script:
    - pnpm typecheck
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull

build:
  stage: build
  needs: [lint, typecheck]
  script:
    - pnpm build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull
  only:
    - main
    - /^release\/.*/

# ─── Scheduled data retention cron ───────────────────────────────────────────
# Trigger via GitLab CI → Schedules (or an external cron).
# Required CI/CD variables: APP_URL, CRON_SECRET
retention:
  stage: cron
  image: curlimages/curl:latest
  before_script: []  # override default node before_script
  script:
    - |
      echo "Running data retention cleanup..."
      RESPONSE=$(curl --fail --silent --show-error \
        --max-time 120 \
        -H "Authorization: Bearer ${CRON_SECRET}" \
        "${APP_URL}/api/cron/retention")
      echo "Response: ${RESPONSE}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
